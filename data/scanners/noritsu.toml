# Noritsu lab-scanner look, one table per film type, shared by every film.
#
# The input is the balanced, keyed log10 signal: sign * net - offset + keys,
# with sign +1 for negatives and -1 for positives, so it rises with the
# scene's light for every film and a metered grey sits at 0. Each channel
# goes through a monotone cubic (Fritsch-Carlson) on the shared knots, whose
# output is log10 linear Rec. 2020 light; then the matrix (rows sum to 1, so
# greys stay grey); then, for B&W, the cast (log10 tint).
#
# Fitted by scripts/lab_scan/fit.py to Color Precision's studio scans of the
# ColorChecker Digital SG; see docs/lab-scan-accuracy.md. Every curve passes
# through the reference grey (log10 0.18 at 0), so a metered grey scans at
# 18%, neutral on colour films and with the look's tint on B&W.

